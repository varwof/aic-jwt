name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOPROXY: https://goproxy.cn,direct
  GOFLAGS: -buildvcs=false
  GOSUMDB: sum.golang.org

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -count=1 ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
